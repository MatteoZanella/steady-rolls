# Tests on every push to main and every pull request. A version tag on main (v1.2.3, or
# v1.2.3-beta.1 for a prerelease) goes on to a GitHub release: the package is built with the
# tag's version, tested as built, and published with its CHANGELOG.md section as notes.
# Actions are pinned to commits (the tag in the comment); Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

# A newer push cancels the run it replaces; a release is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- $TAG
      - name: Test the package as built
        run: npm run test:dist
      - name: Package
        if: env.TAG
        run: cd dist && zip -r ../module.zip .
      - if: env.TAG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            module.zip
            dist/module.json

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not a commit on main"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: node tools/changelog.mjs "$TAG" > notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" module.zip dist/module.json \
            --verify-tag --notes-file notes.md "${prerelease[@]}"
